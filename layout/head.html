<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acep Triana - System Administrator & Full-Stack Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        background: '#0B0A10',
                        surface: '#13111C',
                        surface2: '#1C1929',
                        primary: '#6D28D9', // Purple
                        primaryHover: '#5B21B6',
                        textPrimary: '#F8FAFC',
                        textSecondary: '#94A3B8',
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0A10;
            color: #F8FAFC;
        }
        .glass-panel {
            background: rgba(19, 17, 28, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .text-gradient {
            background: linear-gradient(to right, #A78BFA, #C084FC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Blob animations */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            border-radius: 50%;
        }
        .blob-1 { top: 10%; left: 10%; width: 300px; height: 300px; background: rgba(109, 40, 217, 0.3); }
        .blob-2 { top: 40%; right: 10%; width: 400px; height: 400px; background: rgba(109, 40, 217, 0.2); }
        .blob-3 { bottom: 10%; left: 20%; width: 350px; height: 350px; background: rgba(109, 40, 217, 0.25); }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0A10; 
        }
        ::-webkit-scrollbar-thumb {
            background: #1C1929; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2D2840; 
        }
    </style>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
